name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# id-token: write lets the job exchange GitHub's OIDC token for short-lived AWS credentials,
# so no long-lived AWS keys are stored in GitHub.
permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: expert-profile-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build-and-push:
    needs: test
    # skipped until the AWS_ROLE_ARN repository variable has been added (see GUIDE_KR.md)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
      # App Runner is configured with auto-deployment on the ':latest' tag, so pushing the image
      # is all that is needed to roll out a new version.
