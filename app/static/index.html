<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expert Profile Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Malgun Gothic",sans-serif;background:#f4f5f7;color:#1f2430}
  .wrap{max-width:1180px;margin:0 auto;padding:24px}
  h1{font-size:20px;margin:0 0 4px} .sub{color:#667;font-size:13px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:440px 1fr;gap:20px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid #dfe2e8;border-radius:10px;padding:16px}
  label{display:block;font-size:12px;font-weight:600;color:#445;margin:12px 0 4px} label:first-child{margin-top:0}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid #c9ced8;border-radius:6px;font-size:13px;font-family:inherit}
  textarea{resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{cursor:pointer;border:0;border-radius:6px;padding:9px 14px;font-size:13px;font-weight:600;font-family:inherit}
  .primary{background:#1a56db;color:#fff;width:100%;margin-top:14px;padding:10px}
  .primary:disabled{background:#9db4ea;cursor:wait}
  .sec{background:#e8ebf2;color:#223} .copy{background:#0f7b4f;color:#fff}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .status{font-size:12px;color:#667}
  .warn{font-size:12px;color:#a15c00;background:#fff6e5;border:1px solid #f3d9a4;border-radius:6px;padding:6px 10px;margin-bottom:8px}
  #out{background:#fff;border:1px solid #dfe2e8;border-radius:10px;padding:24px 28px;min-height:260px}
  details{margin-bottom:14px} summary{cursor:pointer;font-weight:600;font-size:13px}
  .hist{font-size:12px;color:#445;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Expert Profile Builder</h1>
  <div class="sub">Paste career text and screening questions; get an email-ready, formatted profile. Demo data only.</div>

  <details id="settings"><summary>API key (stored for this browser tab only)</summary>
    <div class="card" style="margin-top:8px"><input type="password" id="apiKey" placeholder="X-API-Key"></div>
  </details>

  <div class="grid">
    <div class="card">
      <div class="bar"><span class="status">Load sample:</span><span id="samples"></span></div>
      <div class="row">
        <div><label for="style">Style</label>
          <select id="style"><option value="standard">standard</option><option value="clearance">clearance</option></select></div>
        <div><label for="locale">Language</label>
          <select id="locale"><option value="en">English</option><option value="ko">한국어</option></select></div>
      </div>
      <div class="row">
        <div><label for="client_label">Client label</label><input id="client_label" value="Client A"></div>
        <div><label for="recipient">Recipient</label><input id="recipient" placeholder="optional"></div>
      </div>
      <div class="row">
        <div><label for="target_company">Target company</label><input id="target_company"></div>
        <div><label for="expert_code">Expert code</label><input id="expert_code" placeholder="digits are fine"></div>
      </div>
      <label for="career_text">Career (4-line blocks)</label><textarea id="career_text" rows="8"></textarea>
      <div class="row">
        <div><label for="rate">Rate</label><input id="rate" placeholder="450 USD"></div>
        <div><label for="sender_signoff">Sign-off</label><input id="sender_signoff" placeholder="optional"></div>
      </div>
      <label for="availability_text">Availability (free text; ISO form works without an LLM)</label>
      <textarea id="availability_text" rows="2"></textarea>
      <label for="vq_text">VQs</label><textarea id="vq_text" rows="4"></textarea>
      <button class="primary" id="go">Generate profile</button>
    </div>
    <div>
      <div class="bar"><button class="copy" id="copy" disabled>Copy with formatting</button><span class="status" id="status"></span></div>
      <div id="notes"></div>
      <div id="out" contenteditable="true" spellcheck="false"><span class="status">Output appears here and stays editable.</span></div>
      <div class="hist" id="hist"></div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const FIELDS = ["style","locale","client_label","recipient","target_company","expert_code","career_text","rate","sender_signoff","availability_text","vq_text"];
$("apiKey").value = sessionStorage.getItem("pk") || "";
$("apiKey").onchange = () => sessionStorage.setItem("pk", $("apiKey").value);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

fetch("/api/sample").then(r => r.json()).then(list => {
  list.forEach((s, i) => {
    const b = document.createElement("button"); b.className = "sec"; b.style.marginRight = "6px"; b.textContent = "Sample " + (i + 1); b.title = s.name;
    b.onclick = () => FIELDS.forEach(f => { if (f in s.request) $(f).value = s.request[f]; });
    $("samples").appendChild(b);
  });
});

async function refreshHistory() {
  try {
    const r = await fetch("/api/profiles?limit=5", {headers: {"X-API-Key": $("apiKey").value}});
    if (!r.ok) return;
    const items = await r.json();
    $("hist").innerHTML = items.length ? "<b>Recent:</b> " + items.map(i => esc(i.target_company) + " (" + esc(i.expert_code) + ")").join(" · ") : "";
  } catch (e) {}
}

$("go").onclick = async () => {
  const body = {}; FIELDS.forEach(f => body[f] = $(f).value);
  $("go").disabled = true; $("go").textContent = "Generating..."; $("notes").innerHTML = ""; $("status").textContent = "";
  try {
    const r = await fetch("/api/profile", {method: "POST", headers: {"Content-Type": "application/json", "X-API-Key": $("apiKey").value}, body: JSON.stringify(body)});
    if (r.status === 401) throw new Error("Invalid or missing API key");
    if (!r.ok) throw new Error("Request failed (" + r.status + ")");
    const d = await r.json();
    $("out").innerHTML = d.html; $("copy").disabled = false;
    $("notes").innerHTML = d.warnings.map(w => '<div class="warn">' + esc(w) + "</div>").join("");
    $("status").textContent = d.career_entries + " career entries recognised";
    refreshHistory();
  } catch (e) { $("notes").innerHTML = '<div class="warn">' + esc(e.message) + "</div>"; }
  $("go").disabled = false; $("go").textContent = "Generate profile";
};

$("copy").onclick = () => {
  const range = document.createRange(); range.selectNodeContents($("out"));
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  sel.removeAllRanges(); $("status").textContent = ok ? "Copied - paste into your email" : "Copy failed; select the text manually";
};
refreshHistory();
</script>
</body>
</html>
